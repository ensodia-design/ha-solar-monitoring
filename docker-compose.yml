#
# docker-compose.yml
# Stack complete : Home Assistant + Mosquitto (MQTT) + mppsolar (onduleur) + Frigate (cameras)
#
# Prerequis avant le premier "docker compose up -d" :
#   1) Copier .env.example vers .env et renseigner les vraies valeurs
#   2) Adapter le chemin du port serie de l'onduleur (SERIAL_DEVICE dans .env)
#   3) Adapter le point de montage du disque d'enregistrement camera (CAMERA_STORAGE_PATH dans .env)
#   4) Creer frigate/config.yml a partir du modele fourni (voir frigate/config.yml.example)
#
# Usage :
#   docker compose up -d
#   docker compose logs -f            # tous les services
#   docker compose logs -f mppsolar   # un service en particulier
#
version: "3.9"

services:

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ${HA_CONFIG_PATH:-/opt/homeassistant/config}:/config

  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ${MQ_BASE_PATH:-/opt/mosquitto}/config:/mosquitto/config
      - ${MQ_BASE_PATH:-/opt/mosquitto}/data:/mosquitto/data
      - ${MQ_BASE_PATH:-/opt/mosquitto}/log:/mosquitto/log

  mppsolar:
    build:
      context: ./mppsolar
    container_name: mppsolar
    restart: unless-stopped
    depends_on:
      - mosquitto
    devices:
      # Adapter au vrai chemin une fois le cable RS232 branche, ex:
      # /dev/serial/by-id/usb-FTDI_FT231X-if00-port0:/dev/ttyUSB0
      - ${SERIAL_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USER=${MQTT_USER:-homeassistant}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - SERIAL_PORT=/dev/ttyUSB0
      - PROTOCOL=${INVERTER_PROTOCOL:-PI30}
      - LOOP_PAUSE=${MPPSOLAR_PAUSE:-10}

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    privileged: true   # necessaire pour l'acces materiel (Coral, decodage video)
    shm_size: "256mb"  # augmenter si plusieurs cameras haute resolution (ex: 512mb pour 4+ cameras)
    depends_on:
      - mosquitto
    devices:
      # Decommenter si Coral USB Accelerator branche :
      # - /dev/bus/usb:/dev/bus/usb
      []
    ports:
      - "5000:5000"     # interface web Frigate
      - "8554:8554"     # RTSP restream
      - "8555:8555/tcp" # WebRTC
      - "8555:8555/udp"
    volumes:
      - ./frigate/config.yml:/config/config.yml:ro
      - ${CAMERA_STORAGE_PATH:-/mnt/camera-storage}:/media/frigate
    environment:
      - FRIGATE_MQTT_HOST=mosquitto
      - FRIGATE_MQTT_USER=${MQTT_USER:-homeassistant}
      - FRIGATE_MQTT_PASSWORD=${MQTT_PASSWORD}
